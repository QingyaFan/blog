<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --blue:#2E8FE8; --blue-bg:#F3F8FE; --blue-line:#C9E2FA;
    --orange:#E2681A;
    --ink:#1C2430; --text:#3D4855; --muted:#7A8492; --line:#C6CDD8; --wash:#F3F5F8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1280px;height:420px;overflow:hidden;background:#fff;color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif}
  body{box-shadow:inset 0 0 0 1px var(--line)}
  .canvas{position:relative;width:1280px;height:420px}

  .band{position:absolute;z-index:0;left:24px;top:96px;width:1232px;height:272px;border-radius:12px;
    background:linear-gradient(135deg,#F3F5F8 0%,#FFFFFF 78%)}
  .col-bg.blue{position:absolute;z-index:0;left:24px;top:96px;width:456px;height:272px;border-radius:12px;
    background:linear-gradient(135deg,#F3F8FE 0%,#FFFFFF 72%)}

  .head{position:absolute;z-index:7;top:40px;font-size:19px;font-weight:700;color:var(--ink)}
  .head.left{left:40px;color:var(--blue)}
  .head.a{left:520px}
  .head.b{left:904px}

  .card{position:absolute;z-index:2;background:#fff;border-radius:10px;overflow:hidden}
  .card.blue{border:2px solid var(--blue);padding:10px 18px 10px 52px}
  .card.fact{border:2px solid var(--line);padding:10px 16px}
  .card b{display:block;font-size:20px;line-height:1.25;color:var(--ink);font-weight:700;white-space:nowrap}
  .card small{display:block;font-size:18px;line-height:1.3;color:var(--muted);margin-top:2px;white-space:nowrap}

  .num{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;
    background:var(--blue);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}

  .card.left{left:40px;width:424px}
  .card.budget{left:520px;width:368px}
  .card.identity{left:904px;width:352px}
  .r1{top:112px}.r2{top:206px}.r3{top:300px}
  .h{height:84px}

  .watermark{position:absolute;z-index:6;left:0;top:0;width:1280px;height:420px;pointer-events:none}
</style>
</head>
<body>
<div class="canvas">

  <div class="band"></div>
  <div class="col-bg blue"></div>

  <div class="head left">进入上下文的三层</div>
  <div class="head a">花多少预算</div>
  <div class="head b">身份由谁记住</div>

  <!-- 索引 -->
  <div class="card blue left r1 h"><div class="num">1</div><b>索引 · 每个技能一行</b><small>名字: 描述 · 每次请求都注入</small></div>
  <div class="card fact budget r1 h"><b>400 token（默认）</b><small>按排名累加，放不下的进 dropped</small></div>
  <div class="card fact identity r1 h"><b>不记版本</b><small>只有名字与描述</small></div>

  <!-- 正文 -->
  <div class="card blue left r2 h"><div class="num">2</div><b>正文 · 作为 tool 结果</b><small>use_skill 后进入，首行带前缀</small></div>
  <div class="card fact budget r2 h"><b>N token · 无上限</b><small>estimate_text 估算</small></div>
  <div class="card fact identity r2 h"><b>sha256 前 8 位</b><small>对 SKILL.md 原始字节</small></div>

  <!-- 资源 -->
  <div class="card blue left r3 h"><div class="num">3</div><b>资源 · 直接读文件</b><small>read_skill_resource 后进入</small></div>
  <div class="card fact budget r3 h"><b>无上限 · 宿主定</b><small>一次读多少进多少</small></div>
  <div class="card fact identity r3 h"><b>绑定已加载技能</b><small>未加载要先 use_skill</small></div>

  <svg class="watermark" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="wm" width="420" height="170" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
        <text x="0" y="72" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20"
              font-weight="600" fill="#7A8492" opacity="0.08">cheerfunfun</text>
        <text x="0" y="98" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18"
              fill="#7A8492" opacity="0.08">github.com/QingyaFan/blog</text>
      </pattern>
    </defs>
    <rect width="1280" height="420" fill="url(#wm)"/>
  </svg>

</div>
</body>
</html>
